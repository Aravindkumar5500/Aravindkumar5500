<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Aravind Kumar — Software Developer</title>
  <desc id="desc">A dark navy and violet abstract banner with the name Aravind Kumar and a focus on full-stack engineering and AI systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="0.58" stop-color="#111a35"/>
      <stop offset="1" stop-color="#21133d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62d6ff"/>
      <stop offset="0.55" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#c18aff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c65f7" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7c65f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#a8b5e8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <ellipse cx="1010" cy="160" rx="310" ry="250" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" opacity=".62">
    <circle cx="1000" cy="170" r="118" stroke-width="1.5"/>
    <circle cx="1000" cy="170" r="154" stroke-width="1"/>
    <ellipse cx="1000" cy="170" rx="205" ry="78" stroke-width="1.2" transform="rotate(-28 1000 170)"/>
    <ellipse cx="1000" cy="170" rx="205" ry="78" stroke-width="1.2" transform="rotate(48 1000 170)"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="1000" cy="52" r="5"/>
    <circle cx="1150" cy="169" r="4"/>
    <circle cx="917" cy="285" r="5"/>
    <circle cx="842" cy="106" r="3"/>
  </g>
  <path d="M70 264H500" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <text x="72" y="105" fill="#aebbe8" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="5">SOFTWARE DEVELOPER</text>
  <text x="68" y="177" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">ARAVIND KUMAR</text>
  <text x="72" y="218" fill="#c7d2f4" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1.1">FULL-STACK ENGINEERING  /  AI SYSTEMS</text>
  <text x="72" y="297" fill="#aab6d8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">DESIGNING · BUILDING · SHIPPING</text>
</svg>